const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const ui=document.getElementById('ui'),info=document.getElementById('info');
let cfg=0,vel=1,pausa=false,t=0,tPrev=null,trail=[];
const VELS=[["1x",1],["0.5x",0.5],["0.25x",0.25],["0.1x",0.1]];

function boton(txt,grp,val,sel){const b=document.createElement('button');
  b.textContent=txt;b.dataset.g=grp;b.dataset.v=val;if(sel)b.classList.add('on');
  b.onclick=()=>{if(grp=='c'){cfg=+val;t=0;trail=[]}else if(grp=='v'){vel=+val}
    else{pausa=!pausa;b.textContent=pausa?'▶':'⏸'}
    [...ui.children].forEach(x=>{if(x.dataset.g==grp&&grp!='p')
      x.classList.toggle('on',x.dataset.v==val)});mostrarInfo()};
  ui.appendChild(b)}
DATA.forEach((c,i)=>boton(c.nombre,'c',i,i==0));
const sep=document.createElement('span');sep.style.width='18px';ui.appendChild(sep);
VELS.forEach(([n,v],i)=>boton(n,'v',v,i==0));
boton('⏸','p',0,false);

function mostrarInfo(){const c=DATA[cfg];
  if(c.inf){info.textContent=c.inf;return}
  info.textContent=`v=${c.v.toFixed(2)} m/s · T=${c.T.toFixed(2)} s · paso ${(c.L*100).toFixed(0)} cm`
  +(c.al?` · pendiente ${(c.al*180/Math.PI).toFixed(0)}°`:'')
  +` · vuelo ${c.vuelo}%`+(c.tronco!=null?` · tronco +${c.tronco}°`:'')
  +` · CoT ${c.cot}`+(c.grf?` · GRF pico ${c.grf}× peso`:'')}
mostrarInfo();

function lerp(a,b,u){return a+(b-a)*u}
function ptL(c,i0,i1,u,k,dx){const A=c.frames[i0].p[k],B=c.frames[i1].p[k];
  return [lerp(A[0],B[0]+dx,u),lerp(A[1],B[1],u)]}

function dibujar(ts){
  if(tPrev==null)tPrev=ts;
  if(!pausa)t+=(ts-tPrev)/1000*vel;
  tPrev=ts;
  const c=DATA[cfg],N=c.frames.length,al=c.al||0;
  const nc=Math.floor(t/c.T),tc=t-nc*c.T,fu=tc/c.T*N;
  const i0=Math.floor(fu)%N,i1=(i0+1)%N,u=fu-Math.floor(fu);
  const dx=(i1==0)?2*c.L:0,off=nc*2*c.L;

  const F0=c.frames[i0],F1=c.frames[i1];
  const com=[lerp(F0.com[0],F1.com[0]+dx,u)+off,lerp(F0.com[1],F1.com[1],u)];
  if(!pausa){trail.push(com);if(trail.length>260)trail.shift()}

  const W=cv.width,H=cv.height,esc=c.esc||230,gy=H-38;
  const cam=com[0];

  cx.fillStyle='#14161a';cx.fillRect(0,0,W,H);
  cx.save();cx.translate(W*0.42,gy);cx.rotate(-al);
  const X=x=>(x-cam)*esc, Y=z=>-z*esc;
  // suelo (inclinado si al>0)
  cx.strokeStyle='#3a4150';cx.lineWidth=2;cx.beginPath();
  cx.moveTo(X(cam-3),0);cx.lineTo(X(cam+3),0);cx.stroke();
  cx.fillStyle='#57607a';
  const x0=Math.floor((cam-2.5)/0.5)*0.5;
  for(let xm=x0;xm<cam+2.5;xm+=0.5){
    cx.fillRect(X(xm),0,2,7);
    cx.fillText(xm.toFixed(1),X(xm)-8,22)}
  // estela del CoM
  cx.strokeStyle='rgba(230,220,190,0.35)';cx.lineWidth=1.6;cx.beginPath();
  trail.forEach((q,i)=>{const px=X(q[0]),py=Y(q[1]);
    i?cx.lineTo(px,py):cx.moveTo(px,py)});cx.stroke();

  function pt(k){const q=ptL(c,i0,i1,u,k,dx);return [X(q[0]+off),Y(q[1])]}
  function seg(a,b,col,w){cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';
    cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.stroke()}

  const cad=pt('cadera'),hom=pt('hombro');
  for(const [leg,col] of [[2,'#4fa3ff'],[1,'#ff8c42']]){
    const rod=pt('rodilla_'+leg),tob=pt('tobillo_'+leg),
          he=pt('heel_'+leg),mt=pt('mtp_'+leg),pu=pt('punta_'+leg);
    const w=(leg==1)?5:4, cc=(leg==2)?col+'cc':col;
    seg(cad,rod,cc,w);seg(rod,tob,cc,w);
    seg(he,mt,cc,w-1);seg(mt,pu,cc,w-2);seg(tob,he,cc,2);seg(tob,mt,cc,2);
  }
  // tronco y cabeza
  seg(cad,hom,'#e8e4da',7);
  // brazos (si el ciclo los tiene)
  if(F0.p['mano_1']){
    for(const [b,col] of [[2,'#4fa3ff'],[1,'#ff8c42']]){
      const man=pt('mano_'+b);
      if(F0.p['codo_'+b]){const cod=pt('codo_'+b);
        seg(hom,cod,col,3);seg(cod,man,col,2.5);
        cx.fillStyle=col;cx.beginPath();cx.arc(cod[0],cod[1],2.5,0,7);cx.fill();
      }else{seg(hom,man,col,3)}
      cx.fillStyle=col;cx.beginPath();cx.arc(man[0],man[1],3.5,0,7);cx.fill();
    }
  }
  const dxT=hom[0]-cad[0],dzT=hom[1]-cad[1],nT=Math.hypot(dxT,dzT)||1;
  cx.fillStyle='#e8e4da';cx.beginPath();
  cx.arc(hom[0]+dxT/nT*0.11*esc,hom[1]+dzT/nT*0.11*esc,0.075*esc,0,7);cx.fill();
  // CoM
  cx.fillStyle='#ffd166';cx.beginPath();
  cx.arc(X(com[0]),Y(com[1]),5,0,7);cx.fill();
  // ZMP
  const z0=F0.zmp,z1=F1.zmp;
  if(z0!=null&&z1!=null){const zx=X(lerp(z0,z1+dx,u)+off);
    cx.fillStyle='#7ce38b';cx.beginPath();
    cx.moveTo(zx,-1);cx.lineTo(zx-6,9);cx.lineTo(zx+6,9);cx.fill()}
  cx.restore();
  if(c.vuelo>0&&z0==null&&z1==null){
    cx.fillStyle='#9aa3b2';cx.fillText('vuelo',W*0.42-16,40)}

  requestAnimationFrame(dibujar)}
requestAnimationFrame(dibujar);
</script>
